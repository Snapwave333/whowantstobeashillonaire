name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Fixes'
    labels: ['bug', 'fix']
  - title: '🧰 Maintenance'
    labels: ['chore', 'maintenance']
  - title: '🧪 Tests'
    labels: ['test']
  - title: '📝 Docs'
    labels: ['docs']
exclude-labels: ['skip-changelog']
version-resolver:
  major:
    labels: ['semver:major']
  minor:
    labels: ['semver:minor']
  patch:
    labels: ['semver:patch']
  default: patch
template: |
  ## What's Changed
  $CHANGES
