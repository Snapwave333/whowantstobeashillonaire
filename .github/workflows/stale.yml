name: "Close stale issues and PRs"

on:
  schedule:
    - cron: "0 2 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: "This issue has been automatically marked as stale due to inactivity."
          stale-pr-message: "This PR has been automatically marked as stale due to inactivity."
          close-issue-message: "Closing due to prolonged inactivity."
          close-pr-message: "Closing due to prolonged inactivity."
          exempt-issue-labels: "pinned,security,backlog"
          exempt-pr-labels: "pinned,security"
