<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Who Wants to Be a Shillionaire? — Installer</title>
  <style>
    :root{
      --bg:#060606; --panel:#080808; --accent:#d4a91f; --accent-2:#1e90ff; --glass: rgba(255,255,255,0.06);
      --glass-strong: rgba(255,255,255,0.08); --muted: rgba(255,255,255,0.66);
      --radius:14px; --pad:28px;
      --max-w:1100px; --max-h:760px;
    }
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:radial-gradient(ellipse at 30% 10%, rgba(29,18,7,0.12), transparent 8%), linear-gradient(180deg,#040404 0%, #0b0b0b 100%); color: #fff}
    /* center stage */
    .stage{min-height:100vh; display:grid; place-items:center; padding:40px}
    /* window look (borderless) */
    .installer{
      width:calc(92vw); max-width:var(--max-w); height:calc(86vh); max-height:var(--max-h);
      background:linear-gradient(180deg, rgba(255,255,255,0.015), rgba(0,0,0,0.02));
      border-radius:16px; box-shadow: 0 30px 80px rgba(2,2,2,0.7), inset 0 -1px 0 rgba(255,255,255,0.02);
      position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:stretch;
    }

    /* decorative particle layer */
    .particles{position:absolute;inset:0;pointer-events:none;}
    .particle{position:absolute;border-radius:50%;opacity:.08;filter:blur(8px)}

    /* header + logo */
    .header{padding:calc(var(--pad) * 0.6) var(--pad) 0; text-align:center;}
    .logo-wrap{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 6vw;}
    .logo{max-width:78%; height:auto; object-fit:contain; border-radius:8px; box-shadow: 0 18px 40px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.03) inset; transform-origin:center;}
    /* ensure minimum spacing so logo never clipped */
    .logo-container{width:100%; display:flex; justify-content:center; align-items:center; padding:22px 0;}

    /* content area */
    .content{flex:1; padding:18px var(--pad) 34px; display:flex; flex-direction:column; justify-content:space-between}
    .copy{max-width:980px;margin:0 auto;text-align:center;color:var(--muted); letter-spacing:.2px}

    /* options */
    .opts{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:22px}
    .radio{
      background:linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0.008));
      border-radius:12px;padding:12px 18px;width:520px;max-width:86%;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(0,0,0,0.5);
    }
    .radio input{appearance:none;width:20px;height:20px;border-radius:999px;border:2px solid rgba(255,255,255,0.12);background:transparent;position:relative}
    .radio input:checked{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:rgba(255,255,255,0.16);box-shadow:0 0 12px rgba(30,144,255,0.12) inset}
    .radio label{flex:1;font-weight:600}
    .radio .desc{font-size:13px;color:rgba(255,255,255,0.6)}

    /* progress */
    .progress-wrap{margin-top:28px; width:78%;max-width:820px;margin-left:auto;margin-right:auto}
    .progress-bg{height:18px;border-radius:12px;background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));padding:2px}
    .progress{height:100%; width:0%; border-radius:10px; background:linear-gradient(90deg,var(--accent-2),var(--accent)); box-shadow:0 6px 18px rgba(0,0,0,0.6), 0 0 24px rgba(30,144,255,0.08) inset; transition:width 500ms cubic-bezier(.22,.9,.18,1)}
    .progress .sheen{position:relative;height:100%;display:block}
    .progress .sheen::after{content:'';position:absolute;top:-40%;left:-20%;width:40%;height:200%;transform:skewX(-25deg);background:linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02), rgba(255,255,255,0.06)); animation:shimmer 2.8s linear infinite}
    @keyframes shimmer{to{left:120%}}

    /* buttons */
    .footer{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:6px var(--pad);}
    .btn{padding:10px 16px;border-radius:10px;background:var(--glass);border:1px solid rgba(255,255,255,0.06);backdrop-filter: blur(6px);cursor:pointer;min-width:84px;text-align:center;font-weight:700}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,0.6)}
    .btn.primary{background:linear-gradient(180deg, rgba(30,144,255,0.18), rgba(212,169,31,0.08));border:1px solid rgba(255,255,255,0.06)}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06)}

    /* subtle decor under big title */
    .title-deco{position:absolute;left:0;right:0;bottom:40%;height:120px;pointer-events:none;display:flex;justify-content:center}
    .title-glow{width:50%;height:80px; background: radial-gradient(closest-side, rgba(30,144,255,0.06), transparent 45%);} 

    /* responsive tweaks */
    @media (max-width:760px){
      .radio{width:92%;padding:10px}
      .logo{max-width:92%}
      .progress-wrap{width:92%}
      .installer{height:94vh}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="installer" id="installer">
      <div class="particles" aria-hidden="true"></div>
      <div class="header">
        <div class="logo-container">
          <!-- user logo: ensure big and not clipped -->
          <img class="logo" id="logo" src="assets/images/installer-logo.png" alt="Shillionaire logo"/>
        </div>
        <p class="copy">Welcome to the Shillionaire Installation Wizard</p>
      </div>

      <div class="content">
        <div>
          <div class="opts" role="radiogroup" aria-label="Installation options">
            <div class="radio"><input type="radio" name="install" id="std" checked><label for="std">Standard Install <div class="desc">Recommended — installs with default options</div></label></div>
            <div class="radio"><input type="radio" name="install" id="custom"><label for="custom">Custom Install <div class="desc">Choose components and install path</div></label></div>
          </div>

          <div class="progress-wrap" aria-hidden="false">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:rgba(255,255,255,0.5)">
              <span>Installing files...</span><span id="pct">0%</span>
            </div>
            <div class="progress-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress" id="progress"><span class="sheen"></span></div>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
          <div class="title-deco"><div class="title-glow"></div></div>
          <div class="footer">
            <button class="btn ghost" id="back">Back</button>
            <button class="btn ghost" id="cancel">Cancel</button>
            <button class="btn primary" id="installBtn">Install</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // particle generation (very subtle)
    const particlesEl = document.querySelector('.particles');
    const num = Math.floor(Math.max(12, Math.min(28, window.innerWidth / 60)));
    for(let i=0;i<num;i++){
      const p = document.createElement('div');
      p.className='particle';
      const size = (Math.random()*30)+8;
      p.style.width = size + 'px'; p.style.height = size + 'px';
      p.style.left = (Math.random()*100)+'%'; p.style.top = (Math.random()*75)+'%';
      p.style.background = 'radial-gradient(circle, rgba(255,255,255,0.12), rgba(255,255,255,0.02))';
      p.style.transform = 'translateY('+((Math.random()*40)-20)+'px)';
      particlesEl.appendChild(p);
    }

    // parallax logo subtle tilt on mouse move
    const installer = document.getElementById('installer');
    const logo = document.getElementById('logo');
    installer.addEventListener('mousemove', e=>{
      const r = installer.getBoundingClientRect();
      const cx = r.left + r.width/2; const cy = r.top + r.height/2;
      const dx = (e.clientX - cx)/r.width; const dy = (e.clientY - cy)/r.height;
      logo.style.transform = `translate3d(${dx*12}px, ${dy*7}px, 0) scale(1.01)`;
    });
    installer.addEventListener('mouseleave', ()=> logo.style.transform='translate3d(0,0,0) scale(1)');

    // progress behavior
    const progress = document.getElementById('progress');
    const pct = document.getElementById('pct');
    const installBtn = document.getElementById('installBtn');
    const cancel = document.getElementById('cancel');
    let value = 0; let running=false; let timer;

    function startInstall(){
      if(running) return; running=true; installBtn.textContent='Installing...';
      timer = setInterval(()=>{
        // variable speed to feel organic
        value += Math.max(0.6, Math.random()*4);
        if(value>=100){ value=100; finishInstall(); }
        updateProgress();
      }, 300 + Math.random()*200);
    }
    function updateProgress(){
      progress.style.width = value + '%'; pct.textContent = Math.round(value) + '%';
      progress.parentElement.setAttribute('aria-valuenow', Math.round(value));
    }
    function finishInstall(){
      clearInterval(timer); running=false; installBtn.textContent='Install';
      // small success glow
      progress.style.boxShadow = '0 10px 48px rgba(30,144,255,0.14)';
      setTimeout(()=>alert('Installation complete (mockup).'),120);
    }
    installBtn.addEventListener('click', startInstall);
    cancel.addEventListener('click', ()=>{
      if(running){ clearInterval(timer); running=false; alert('Installation cancelled.'); progress.style.width='0%'; value=0; updateProgress(); installBtn.textContent='Install'; }
      else alert('Cancelled (no operation in mockup).');
    });

    // ensure logo is always properly visible by enforcing padding on load/resize
    function ensureLogoPadding(){
      const wrap = document.querySelector('.logo-container');
      const pad = Math.max(window.innerWidth * 0.07, 28);
      wrap.style.paddingLeft = pad + 'px'; wrap.style.paddingRight = pad + 'px'; wrap.style.paddingTop = (pad*0.6)+'px';
    }
    window.addEventListener('resize', ensureLogoPadding); ensureLogoPadding();

    // accessibility: keyboard activate install via enter when focused
    installBtn.addEventListener('keyup', e=>{ if(e.key==='Enter') startInstall(); });
  </script>
</body>
</html>
