<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shillionaire Icon Preview</title>
  <link rel="icon" href="app.ico" type="image/x-icon" />
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 24px; }
    .row { display:flex; gap:32px; align-items:center; }
    img { border-radius: 24px; box-shadow: 0 6px 24px rgba(0,0,0,0.2); }
    .note { color:#555; margin-top:12px; }
  </style>
</head>
<body>
  <h1>Who Wants to Be a Shillionaire — Icon Preview</h1>
  <p class="note">Favicon uses <code>assets/app.ico</code>. PNG shown at native resolution below.</p>
  <div class="row">
    <div>
      <h3>PNG</h3>
      <img src="images/icons/shill.png" alt="Shillionaire Icon PNG" width="256" height="256" />
    </div>
    <div>
      <h3>ICO (fav)</h3>
      <iframe src="app.ico" style="width:256px;height:256px;border:1px solid #ccc;border-radius:24px;"></iframe>
    </div>
  </div>
</body>
</html>
